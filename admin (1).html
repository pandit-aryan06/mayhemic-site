<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Mayhemic Admin</title>
<style>
:root{--bg:#000;--card:#0d0d0f;--line:#232326;--mute:#8b8b93;--ok:#4ade80;--bad:#f87171;--ac:linear-gradient(135deg,#7c5cff,#00d4ff)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 10% -10%,#1a1440 0,transparent 60%),#000;color:#f2f2f2;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:auto;padding:26px 18px 80px}.lb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
button{font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:6px;padding:10px 16px;border:1px solid #444;background:transparent;color:#fff;transition:.15s}
button:hover{border-color:#fff}button.s{background:#fff;color:#000;border-color:#fff}button.s:hover{background:#ddd}button.sm{padding:6px 10px;font-size:10px}button.d{color:var(--bad);border-color:#4a2222}
input{width:100%;background:#000;border:1px solid #2c2c30;color:#fff;padding:12px;border-radius:6px;font:inherit;font-size:14px}input:focus{outline:none;border-color:#7c5cff}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.logo{letter-spacing:.3em;font-weight:300}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;margin-top:14px}
.sc{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.sc h3{margin:0;font-weight:500}
.tag{font-size:10px;letter-spacing:.12em;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mute);margin-left:8px;text-transform:uppercase}.tag.on{color:var(--ok);border-color:#1d4a2e}
.u{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line);margin-top:10px}
.u code{background:#16161a;padding:4px 8px;border-radius:5px;font-size:13px}.acts{display:flex;gap:6px;flex-wrap:wrap}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#login h1{font-weight:300;letter-spacing:.3em;margin:6px 0 30px;font-size:30px}#login .bx{width:100%;max-width:340px}#login button{width:100%;margin-top:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:18px;z-index:9}.ov.show{display:flex}
.mod{background:#111114;border:1px solid #2c2c30;border-radius:14px;padding:26px;width:100%;max-width:400px}
.cred{background:#000;border:1px dashed #444;border-radius:8px;padding:14px;margin:14px 0;font-size:15px;line-height:1.9}.cred b{color:#7ee0ff}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:11px 18px;border-radius:6px;font-size:13px;display:none;z-index:20}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="login"><div class="lb">Admin portal</div><h1>MAYHEMIC</h1>
<div class="bx"><input id="pw" type="password" placeholder="Admin password"><button class="s" onclick="enter()">Enter</button><div id="err" style="color:var(--bad);font-size:13px;margin-top:10px;min-height:18px"></div></div></div>

<div id="app" class="wrap" style="display:none">
<div class="top"><div><div class="logo">MAYHEMIC</div><div class="lb" style="margin-top:4px">Admin portal</div></div><button class="sm" onclick="out()">Log out</button></div>
<div class="card"><div class="lb">New school</div>
<div class="grid"><input id="n" placeholder="School name"><input id="o" placeholder="Owner / director name"><input id="p" placeholder="Owner WhatsApp (optional)"><button class="s" onclick="create()">Create + generate login</button></div></div>
<div id="list"></div></div>

<div class="ov" id="ov"><div class="mod"><h3 style="margin:0;font-weight:500" id="mt">Login created</h3>
<div class="lb" style="margin-top:6px">Save this now. The password is shown only once.</div>
<div class="cred" id="cr"></div>
<div style="display:flex;gap:8px"><button class="s" style="flex:1" onclick="copyCred()">Copy</button><button style="flex:1" onclick="wa()">WhatsApp</button><button style="flex:1" onclick="document.getElementById('ov').classList.remove('show')">Close</button></div></div></div>
<div id="toast"></div>

<script>
const API='https://mayhemic-api.aryanmishra8920.workers.dev',$=i=>document.getElementById(i);
let SEC='';try{SEC=sessionStorage.getItem('as')||''}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3000)}
async function api(p,o={}){o.headers={...(o.headers||{}),'x-admin-secret':SEC,'content-type':'application/json'};const r=await fetch(API+p,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}
async function enter(){SEC=$('pw').value;$('err').textContent='';try{await api('/api/admin/schools');try{sessionStorage.setItem('as',SEC)}catch(e){}show()}catch(e){$('err').textContent=e.message;SEC=''}}
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
function out(){try{sessionStorage.removeItem('as')}catch(e){}SEC='';$('app').style.display='none';$('login').style.display='flex';$('pw').value=''}
function show(){$('login').style.display='none';$('app').style.display='block';load()}
async function load(){try{const d=await api('/api/admin/schools');
$('list').innerHTML=d.schools.length?d.schools.map(s=>`<div class="card"><div class="sc"><div><h3>${esc(s.name)}<span class="tag ${s.active?'on':''}">${s.active?'active':'paused'}</span></h3>
<div class="lb" style="margin-top:6px">${s.students} students${s.owner_name?' / '+esc(s.owner_name):''}</div></div>
<div class="acts"><button class="sm" onclick="addUser(${s.id})">+ Login</button><button class="sm" onclick="tg('schools',${s.id})">${s.active?'Pause':'Resume'}</button><button class="sm d" onclick="del(${s.id},'${esc(s.name).replace(/'/g,'')}')">Delete</button></div></div>
${d.users.filter(u=>u.school_id===s.id).map(u=>`<div class="u"><div><code>${esc(u.login_id)}</code><span class="tag ${u.active?'on':''}">${u.active?'active':'off'}</span></div>
<div class="acts"><button class="sm" onclick="reset(${u.id})">Reset password</button><button class="sm" onclick="tg('users',${u.id})">${u.active?'Disable':'Enable'}</button></div></div>`).join('')}</div>`).join(''):'<div class="card lb">No schools yet. Create your first one above.</div>'}catch(e){toast(e.message)}}
let last='';
function cred(t,r){const url=location.origin+'/fees.html';last=`Mayhemic School Fees\nWebsite: ${url}\nLogin ID: ${r.login_id}\nPassword: ${r.password}`;
$('mt').textContent=t;$('cr').innerHTML=`Website: <b>${esc(url)}</b><br>Login ID: <b>${esc(r.login_id)}</b><br>Password: <b>${esc(r.password)}</b>`;$('ov').classList.add('show')}
function copyCred(){navigator.clipboard.writeText(last).then(()=>toast('Copied'),()=>toast('Copy failed, select and copy manually'))}
function wa(){window.open('https://wa.me/?text='+encodeURIComponent(last),'_blank')}
async function create(){if(!$('n').value.trim())return toast('Enter school name');try{const r=await api('/api/admin/schools',{method:'POST',body:JSON.stringify({name:$('n').value,owner_name:$('o').value,owner_phone:$('p').value})});
$('n').value=$('o').value=$('p').value='';cred('School created',r);load()}catch(e){toast(e.message)}}
async function addUser(id){try{cred('New login created',await api('/api/admin/users',{method:'POST',body:JSON.stringify({school_id:id})}));load()}catch(e){toast(e.message)}}
async function reset(id){if(!confirm('Reset this password? The old one stops working.'))return;try{cred('Password reset',await api('/api/admin/users/'+id+'/reset',{method:'POST'}))}catch(e){toast(e.message)}}
async function tg(k,id){try{await api('/api/admin/'+k+'/'+id+'/toggle',{method:'POST'});load()}catch(e){toast(e.message)}}
async function del(id,n){if(!confirm('Delete "'+n+'" with ALL its students, payments and logins? This cannot be undone.'))return;try{await api('/api/admin/schools/'+id,{method:'DELETE'});toast('Deleted');load()}catch(e){toast(e.message)}}
if(SEC)api('/api/admin/schools').then(show).catch(()=>{SEC=''});
</script></body></html>
