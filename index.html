vers, and rebuild the format of a viral video with your voice, your topic and your footage, so you can run a faceless channel. It asks before publishing anything."}}, {"@type": "Question", "name": "What else can KEO build?", "acceptedAnswer": {"@type": "Answer", "text": "Websites, presentations, games, apps, documents, spreadsheets and scripts. You describe what you want in plain words."}}, {"@type": "Question", "name": "When can I use KEO, and what will it cost?", "acceptedAnswer": {"@type": "Answer", "text": "KEO is in early access. Join the list and we will message you when it is ready for your computer. Pricing has not been announced yet."}}]}</script>
