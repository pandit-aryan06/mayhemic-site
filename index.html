<script>
(function(){
var $=function(s,c){return (c||document).querySelector(s)},$$=function(s,c){return [].slice.call((c||document).querySelectorAll(s))};
var still=matchMedia('(prefers-reduced-motion:reduce)').matches,fine=matchMedia('(pointer:fine)').matches;

/* name: split into letters that rise out of a mask */
var n=0;
$$('.hn .ln').forEach(function(l){
  var t=l.querySelector('em')||l,h='';
  t.textContent.split('').forEach(function(c){h+='<span class="ch" style="--i:'+(n++)+'">'+c+'</span>'});
  t.innerHTML=h;
});
var ld=$('.ld'),lc=$('.lc');
function intro(){document.body.classList.add('go');setTimeout(function(){document.body.classList.add('done')},2800)}
if(still||!ld){if(ld)ld.remove();intro()}
else{
  var t0=performance.now();
  (function C(t){
    var p=Math.min(1,(t-t0)/1200);lc.textContent=Math.round(p*100);
    if(p<1)requestAnimationFrame(C);
    else{ld.classList.add('out');setTimeout(intro,350);setTimeout(function(){ld.remove()},1500)}
  })(t0);
  setTimeout(function(){if(ld.parentNode){ld.remove();intro()}},5000);
}

/* ticker: duplicate for a seamless loop */
var tk=$('.tk div');tk.innerHTML=tk.innerHTML.repeat(6);

/* reveal on scroll */
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15});
$$('.rv').forEach(function(e){io.observe(e)});

/* scroll: progress bar, name drifts away, ticker skews with speed */
var bar=$('.bar'),h1=$('.hg'),tick=0,skT,lastY=0,tkw=tk.parentNode;
function upd(){
  tick=0;var d=document.documentElement,y=scrollY;
  bar.style.transform='scaleX('+(y/Math.max(1,d.scrollHeight-innerHeight)).toFixed(4)+')';
  if(!still){
    var p=Math.min(y,innerHeight);
    h1.style.transform='translate3d(0,'+(p*.18).toFixed(1)+'px,0)';
    h1.style.opacity=(1-p/innerHeight*.7).toFixed(2);
    tkw.style.setProperty('--sk',Math.max(-8,Math.min(8,(lastY-y)*.25)).toFixed(2)+'deg');
    clearTimeout(skT);skT=setTimeout(function(){tkw.style.setProperty('--sk','0deg')},140);
  }
  lastY=y;
}
addEventListener('scroll',function(){if(!tick){tick=1;requestAnimationFrame(upd)}},{passive:true});
addEventListener('resize',upd);upd();

/* cursor follower + magnetic button */
if(fine&&!still){
  var c=$('.cur'),sp=$('.sp'),chs=$$('.ch'),pr=0,x=0,y=0,tx=innerWidth/2,ty=innerHeight/2,sx=tx,sy=ty;
  addEventListener('pointermove',function(e){tx=e.clientX;ty=e.clientY;c.classList.add('on')},{passive:true});
  document.documentElement.addEventListener('pointerleave',function(){c.classList.remove('on')});
  (function L(){
    x+=(tx-x)*.18;y+=(ty-y)*.18;sx+=(tx-sx)*.06;sy+=(ty-sy)*.06;
    c.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
    sp.style.transform='translate3d('+(sx-320).toFixed(1)+'px,'+(sy-320).toFixed(1)+'px,0)';
    requestAnimationFrame(L)
  })();
  addEventListener('pointermove',function(){
    if(pr||!document.body.classList.contains('done'))return;
    pr=requestAnimationFrame(function(){pr=0;chs.forEach(function(l){
      var r=l.getBoundingClientRect(),dx=tx-(r.left+r.width/2),dy=ty-(r.top+r.height/2),d=Math.sqrt(dx*dx+dy*dy);
      l.style.setProperty('--p',Math.max(0,1-d/(r.width*2.2+60)).toFixed(2));
    })});
  },{passive:true});
  document.documentElement.addEventListener('pointerleave',function(){chs.forEach(function(l){l.style.setProperty('--p',0)})});
  $$('a,button,input,textarea').forEach(function(e){
    e.addEventListener('pointerenter',function(){c.classList.add('big')});
    e.addEventListener('pointerleave',function(){c.classList.remove('big')});
  });
  $$('[data-mag]').forEach(function(b){
    b.addEventListener('pointermove',function(e){var r=b.getBoundingClientRect();b.style.transform='translate('+((e.clientX-r.left-r.width/2)*.25).toFixed(1)+'px,'+((e.clientY-r.top-r.height/2)*.35).toFixed(1)+'px)'});
    b.addEventListener('pointerleave',function(){b.style.transform=''});
  });
}

/* background: breathing dot grid that swells and turns orange around your cursor */
(function(){
var cv=$('#net'),cx=cv.getContext('2d'),W=0,H=0,dpr=Math.min(devicePixelRatio||1,1.5),M={x:-9999,y:-9999,sx:-9999,sy:-9999},t=0,raf=0,rt,G=30,Bk=[[],[],[],[]],AL=[.1,.14,.19,.25];
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);G=W<600?26:30;if(still)draw()}
function draw(){
  raf=0;t+=.014;cx.clearRect(0,0,W,H);
  M.sx+=(M.x-M.sx)*.12;M.sy+=(M.y-M.sy)*.12;
  var cols=Math.ceil(W/G)+1,rows=Math.ceil(H/G)+1,i,j,k,x,y,v,r,dx,dy,d2,nr,b;
  for(k=0;k<4;k++)Bk[k].length=0;
  for(j=0;j<rows;j++){for(i=0;i<cols;i++){
    x=i*G;y=j*G;
    v=Math.sin(i*.28+t)+Math.sin(j*.32-t*1.1)+Math.sin((i+j)*.18+t*.7);
    r=1.6+(v+3)/6*3.4;
    dx=x-M.sx;dy=y-M.sy;d2=dx*dx+dy*dy;
    if(d2<40000){
      nr=1-d2/40000;
      cx.fillStyle='rgba(255,79,31,'+(.35+nr*.6).toFixed(2)+')';
      cx.beginPath();cx.arc(x,y,r+nr*6,0,6.283);cx.fill();
    }else{
      b=Math.min(3,((v+3)/6*4)|0);Bk[b].push(x,y,r);
    }
  }}
  for(k=0;k<4;k++){
    var a=Bk[k];if(!a.length)continue;
    cx.fillStyle='rgba(14,14,14,'+AL[k]+')';cx.beginPath();
    for(j=0;j<a.length;j+=3){cx.moveTo(a[j]+a[j+2],a[j+1]);cx.arc(a[j],a[j+1],a[j+2],0,6.283)}
    cx.fill();
  }
  if(!still&&!document.hidden)raf=requestAnimationFrame(draw);
}
size();if(!still)draw();
addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(size,150)});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!raf&&!still)draw()});
addEventListener('pointermove',function(e){M.x=e.clientX;M.y=e.clientY},{passive:true});
document.documentElement.addEventListener('pointerleave',function(){M.x=M.y=-9999});
addEventListener('pointerup',function(e){if(e.pointerType&&e.pointerType!=='mouse')setTimeout(function(){M.x=M.y=-9999},500)},{passive:true});
})();

/* contact form: sends without leaving the page */
var fm=$('#f'),sb=$('#sb'),st=$('#st');
fm.addEventListener('submit',function(e){
  e.preventDefault();sb.disabled=true;sb.textContent='Sending…';st.className='';st.textContent='';
  fetch(fm.action,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(fm)))})
  .then(function(r){return r.json()})
  .then(function(d){if(d.success){fm.reset();st.className='ok';st.textContent='Message sent. I will reply to your email soon.'}else{throw new Error()}})
  .catch(function(){st.className='er';st.textContent='Could not send. Check your connection and try again, or email me directly.'})
  .then(function(){sb.disabled=false;sb.textContent='Send message'});
});
$('#yr').textContent=new Date().getFullYear();
})();
</script>
