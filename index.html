.l{display:inline-block;font-variation-settings:"wdth" 75,"wght" 760;background:linear-gradient(180deg,#fff 0%,#dfe5ee 40%,#6f7888 100%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;filter:blur(16px);transform:translate3d(var(--x,0),var(--y,0),0) rotate(var(--r,0deg)) scale(var(--s,1));transition:transform 1.7s var(--e) var(--d,0s),opacity .5s ease var(--d,0s),filter 1.3s ease var(--d,0s);will-change:transform}
.go .l{opacity:1;transform:none;filter:blur(0)}.rs .l{transition:none}
.done .l{will-change:auto;transition:transform .4s var(--e),filter .4s ease,font-variation-settings .45s var(--e);transform:translateY(calc(var(--p,0)*-.05em));filter:brightness(calc(1 + var(--p,0)*.45));font-variation-settings:"wdth" calc(75 + var(--p,0)*25),"wght" calc(760 + var(--p,0)*40)}
.ln{width:min(260px,40vw);height:1px;margin-top:clamp(18px,3.5vh,40px);background:linear-gradient(90deg,transparent,var(--ice),transparent);transform:scaleX(0);animation:ln 1.4s var(--e) 2.6s forwards}
@keyframes ln{to{transform:scaleX(1)}}

form button{background:#fff;color:#05060a;border:0;border-radius:50px;padding:15px;font:inherit;font-weight:700;cursor:pointer;transition:background .25s}form button:hover{background:var(--ice)}form button:disabled{opacity:.6;cursor:wait}

<h1 id="nm" aria-label="Aryan Mishra"><span class="sr">Aryan Mishra</span>
<span class="wd" aria-hidden="true"><span class="l">A</span><span class="l">R</span><span class="l">Y</span><span class="l">A</span><span class="l">N</span></span>
<span class="wd" aria-hidden="true"><span class="l">M</span><span class="l">I</span><span class="l">S</span><span class="l">H</span><span class="l">R</span><span class="l">A</span></span></h1>

<script>
(function(){
var h=document.getElementById('nm'),ls=[].slice.call(h.querySelectorAll('.l')),still=matchMedia('(prefers-reduced-motion:reduce)').matches,tm,last=0;
function rnd(a){return (Math.random()*2-1)*a}

/* Name entrance: letters fly in from random places, sharpen, and settle */
function run(){
  clearTimeout(tm);h.classList.add('rs');h.classList.remove('go','done');
  ls.forEach(function(l,i){l.style.setProperty('--p',0);l.style.setProperty('--x',rnd(innerWidth*.7)+'px');l.style.setProperty('--y',rnd(innerHeight*.7)+'px');l.style.setProperty('--r',rnd(220)+'deg');l.style.setProperty('--s',(.4+Math.random()*1.8).toFixed(2));l.style.setProperty('--d',(i*.07+Math.random()*.25).toFixed(2)+'s')});
  void h.offsetWidth;h.classList.remove('rs');
  requestAnimationFrame(function(){requestAnimationFrame(function(){h.classList.add('go');tm=setTimeout(function(){h.classList.add('done')},3300)})});
}
if(still){h.classList.add('go','done')}else{run()}
h.addEventListener('click',function(){if(!still)run()});

/* Network of nodes: you are the bright one they connect to */
var cv=document.getElementById('net'),cx=cv.getContext('2d'),W,H,N=[],dpr=Math.min(devicePixelRatio||1,2),M={x:-999,y:-999};
function size(){
  W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  var n=Math.min(80,Math.round(W*H/17000));N=[];
  for(var i=0;i<n;i++)N.push({x:Math.random()*W,y:Math.random()*H,vx:rnd(.25),vy:rnd(.25),r:Math.random()*1.4+.6});
  if(still)draw();
}
function draw(){
  cx.clearRect(0,0,W,H);
  for(var i=0;i<N.length;i++){
    var a=N[i];
    if(!still){
      var dx=M.x-a.x,dy=M.y-a.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<200&&d>1){a.vx+=dx/d*.012;a.vy+=dy/d*.012}
      a.vx*=.995;a.vy*=.995;
      var sp=Math.sqrt(a.vx*a.vx+a.vy*a.vy);if(sp>.7){a.vx*=.7/sp;a.vy*=.7/sp}
      a.x+=a.vx;a.y+=a.vy;
      if(a.x<-10)a.x=W+10;else if(a.x>W+10)a.x=-10;
      if(a.y<-10)a.y=H+10;else if(a.y>H+10)a.y=-10;
    }
    for(var j=i+1;j<N.length;j++){
      var b=N[j],ex=a.x-b.x,ey=a.y-b.y,e=Math.sqrt(ex*ex+ey*ey);
      if(e<120){cx.strokeStyle='rgba(174,184,198,'+((1-e/120)*.16).toFixed(3)+')';cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}
    }
    var mx=M.x-a.x,my=M.y-a.y,m=Math.sqrt(mx*mx+my*my);
    if(m<180){cx.strokeStyle='rgba(143,211,255,'+((1-m/180)*.55).toFixed(3)+')';cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(M.x,M.y);cx.stroke()}
    cx.fillStyle='rgba(200,210,224,.55)';cx.beginPath();cx.arc(a.x,a.y,a.r,0,6.283);cx.fill();
  }
  if(M.x>0){cx.fillStyle='#8fd3ff';cx.beginPath();cx.arc(M.x,M.y,3,0,6.283);cx.fill()}
  if(!still)requestAnimationFrame(draw);
}
size();addEventListener('resize',size);if(!still)draw();

/* Pointer: light, letter swell, magnetic button */
var mb=document.getElementById('mb'),cp=document.getElementById('cp');
if(!still){
  var raf=0;
  addEventListener('pointermove',function(e){
    M.x=e.clientX;M.y=e.clientY;last=Date.now();
    if(raf)return;
    raf=requestAnimationFrame(function(){
      raf=0;
      document.body.style.setProperty('--mx',M.x+'px');
      document.body.style.setProperty('--my',M.y+'px');
      var b=mb.getBoundingClientRect(),bx=M.x-(b.left+b.width/2),by=M.y-(b.top+b.height/2),bd=Math.sqrt(bx*bx+by*by);
      mb.style.transform=bd<110?'translate('+(bx*.22).toFixed(1)+'px,'+(by*.28).toFixed(1)+'px)':'';
      if(!h.classList.contains('done'))return;
      ls.forEach(function(l){
        var r=l.getBoundingClientRect(),dx=M.x-(r.left+r.width/2),dy=M.y-(r.top+r.height/2),d=Math.sqrt(dx*dx+dy*dy),R=Math.max(r.width,90)*1.7;
        l.style.setProperty('--p',Math.max(0,1-d/R).toFixed(2));
      });
    });
  },{passive:true});
  document.documentElement.addEventListener('pointerleave',function(){M.x=M.y=-999;mb.style.transform='';ls.forEach(function(l){l.style.setProperty('--p',0)})});
  /* When nobody is moving a pointer, a wave of light runs through the name */
  setInterval(function(){
    if(!h.classList.contains('done')||Date.now()-last<2500)return;
    ls.forEach(function(l,i){setTimeout(function(){l.style.setProperty('--p',.85);setTimeout(function(){l.style.setProperty('--p',0)},420)},i*95)});
  },6500);
}

/* Contact panel */
function toggle(open){
  var o=cp.classList.toggle('on',open);
  mb.setAttribute('aria-expanded',o);mb.textContent=o?'Close':'Message me';
  if(o)setTimeout(function(){cp.scrollIntoView({behavior:still?'auto':'smooth',block:'center'});document.getElementById('n').focus({preventScroll:true})},60);
  else mb.focus();
}
mb.onclick=function(){toggle()};
addEventListener('keydown',function(e){if(e.key==='Escape'&&cp.classList.contains('on'))toggle(false)});

/* Copy email */
var cb=document.getElementById('cb');
cb.onclick=function(){
  var t=document.getElementById('em').textContent;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){cb.textContent='Copied'},function(){cb.textContent='Press and hold the email to copy'});
  setTimeout(function(){cb.textContent='Copy'},2200);
};

/* Send without leaving the page */
var f=document.getElementById('f'),sb=document.getElementById('sb'),st=document.getElementById('st');
f.addEventListener('submit',function(e){
  e.preventDefault();
  sb.disabled=true;sb.textContent='Sending…';st.className='';st.textContent='';
  fetch(f.action,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))})
  .then(function(r){return r.json()})
  .then(function(d){
    if(d.success){f.reset();st.className='ok';st.textContent='Message sent. I will reply to your email soon.'}
    else{throw new Error()}
  })
  .catch(function(){st.className='er';st.textContent='Could not send. Check your connection and try again, or email me directly.'})
  .then(function(){sb.disabled=false;sb.textContent='Send message'});
});
document.getElementById('yr').textContent=new Date().getFullYear();
})();
</script>
