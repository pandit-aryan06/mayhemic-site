<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Mayhemic Teacher</title>
<style>
:root{--bg:#050507;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--mute:#8b8b98;--ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;--ac:linear-gradient(135deg,#7c5cff,#00d4ff)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(800px 500px at 90% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(700px 500px at -10% 100%,rgba(0,212,255,.13),transparent 60%),var(--bg);color:#f4f4f6;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.lb{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
button{font:inherit;cursor:pointer;border-radius:10px;font-size:13px;font-weight:600;padding:11px 18px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;transition:.18s}
button:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}button.p{background:#fff;color:#000;border-color:#fff}button.p:hover{background:#e4e4e8}button.sm{padding:7px 13px;font-size:12px}
input,select{width:100%;background:rgba(0,0,0,.45);border:1px solid var(--line);color:#fff;padding:13px;border-radius:10px;font:inherit;font-size:14px}
input:focus,select:focus{outline:none;border-color:#7c5cff;box-shadow:0 0 0 3px rgba(124,92,255,.2)}
.glass{background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
/* shell */
#app{display:block}
.side{position:fixed;left:0;top:0;bottom:0;width:230px;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:rgba(5,5,7,.6);backdrop-filter:blur(14px);z-index:5}
.logo{letter-spacing:.3em;font-weight:300;font-size:15px;padding:0 10px}.sn{font-size:12px;color:var(--mute);padding:4px 10px 22px}
.side nav button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--mute);margin-bottom:4px;padding:12px;font-weight:500}
.side nav button.on{background:rgba(124,92,255,.16);color:#fff}.side nav button i{font-style:normal;width:18px;text-align:center}
.bot{margin-top:auto;display:flex;flex-direction:column;gap:6px}.bot a,.bot button{color:var(--mute);font-size:13px;text-decoration:none;padding:10px;background:none;border:0;text-align:left;font-weight:500}.bot a:hover,.bot button:hover{color:#fff}
main{margin-left:230px;padding:30px 32px 90px;max-width:1180px}
.view{display:none;animation:up .45s both}.view.on{display:block}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.hd{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:24px}.hd h2{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input{flex:1;min-width:200px}
.tbl{overflow-x:auto;padding:4px 8px}table{width:100%;border-collapse:collapse;font-size:14px;min-width:680px}
th{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-align:left;padding:14px 12px;font-weight:500}td{padding:13px 12px;border-top:1px solid var(--line)}tr:hover td{background:rgba(255,255,255,.03)}
.rt{text-align:right}.empty{padding:50px;text-align:center;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.ov.show{display:flex}
.mod{background:#0e0e12;border:1px solid var(--line);border-radius:20px;padding:26px;width:100%;max-width:530px;max-height:92vh;overflow:auto;animation:pop .25s both}@keyframes pop{from{opacity:0;transform:scale(.95)}}
.mod h3{margin:0 0 4px;font-size:20px}.rw{margin-top:14px}.rw .lb{display:block;margin-bottom:6px}.acts{display:flex;gap:10px;margin-top:22px}.acts button{flex:1}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;display:none;z-index:50}

/* PDF Report Styling Layer */
#pdfReportContainer { display: none; }
@media print {
  body * { visibility: hidden; }
  #pdfReportContainer, #pdfReportContainer * { visibility: visible; }
  #pdfReportContainer { display: block; position: absolute; left: 0; top: 0; width: 100%; background: #fff; color: #000; padding: 30px; }
}

@media(max-width:900px){.side{top:auto;width:100%;height:64px;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line)}.side .logo,.side .sn,.bot{display:none}.side nav{display:flex;width:100%;gap:4px}.side nav button{flex-direction:column;gap:2px;font-size:10px;justify-content:center;padding:6px;margin:0;text-align:center}
main{margin:0;padding:20px 16px 100px}.hd h2{font-size:22px}}
</style></head><body>
<div id="app">
  <aside class="side">
    <div class="logo">MAYHEMIC</div><div class="sn" id="sname"></div>
    <nav>
      <button data-v="att" class="on"><i>✓</i>Attendance</button>
      <button data-v="reports"><i>📊</i>Reports & PDF</button>
      <button data-v="notice"><i>✉</i>Notices</button>
    </nav>
    <div class="bot"><a href="/">&larr; Website</a><button onclick="logout()">Log out</button></div>
  </aside>
  <main>
    <section class="view on" id="v-att">
      <div class="hd">
        <div><div class="lb" id="tcls"></div><h2 id="greet">Attendance</h2></div>
        <div style="display:flex; gap:10px;">
          <button class="sm p" onclick="generateAbsenceNotice()">📢 Send Daily Absentee Notice</button>
        </div>
      </div>
      <div id="attBox" class="glass" style="padding:20px;"></div>
    </section>

    <section class="view" id="v-reports">
      <div class="hd">
        <div><div class="lb">Analytics</div><h2>Reports & PDF Export</h2></div>
      </div>
      <div class="glass" style="padding:24px; margin-bottom:20px;">
        <h3>Generate Reports</h3>
        <p style="color:var(--mute); font-size:13px;">Download or print formatted PDF performance reports for monthly cycles or aggregate session overviews.</p>
        <div style="display:flex; gap:12px; margin-top:16px; flex-wrap:wrap;">
          <div>
            <label class="lb" style="display:block; margin-bottom:6px;">Select Month</label>
            <input type="month" id="reportMonth" style="padding:10px;">
          </div>
          <div style="display:flex; align-items:flex-end; gap:10px;">
            <button class="p" onclick="exportReport('monthly')">🖨️ Print / Save Monthly PDF</button>
            <button onclick="exportReport('session')">📈 Overall Session Report</button>
          </div>
        </div>
      </div>
      <div id="reportPreviewArea" class="glass" style="padding:24px;">
        <div class="empty">Select a report criteria above to view preview data.</div>
      </div>
    </section>

    <section class="view" id="v-notice">
      <div class="hd"><div><div class="lb">Circulars</div><h2>Notices</h2></div></div>
      <div id="noticeBox"></div>
    </section>
  </main>
</div>

<!-- Hidden PDF printable container structure -->
<div id="pdfReportContainer">
  <h1 id="pdfTitle" style="margin:0 0 5px 0; font-size:24px;">Mayhemic Academic Report</h1>
  <p id="pdfSubtitle" style="color:#555; margin:0 0 20px 0; font-size:14px;"></p>
  <hr style="border:0; border-top:1px solid #ccc; margin-bottom:20px;">
  <div id="pdfContentBody"></div>
</div>

<div id="toast"></div>
<script src="att.js"></script>
<script>
const API='https://mayhemic-api.aryanmishra8920.workers.dev',$=i=>document.getElementById(i);
let TOK='';try{TOK=sessionStorage.getItem('mt')||''}catch(e){}
if(!TOK)location.replace('/fees.html');

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3400)}
async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+TOK};const r=await fetch(API+p,o);const d=await r.json().catch(()=>({}));if(r.status===401){logout(true);throw new Error('Please log in again')}if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
function logout(quiet){if(TOK&&!quiet)fetch(API+'/api/logout',{method:'POST',headers:{Authorization:'Bearer '+TOK}}).catch(()=>{});try{sessionStorage.clear()}catch(e){}location.replace('/fees.html')}

document.querySelectorAll('.side nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+b.dataset.v));
  document.querySelectorAll('.side nav button').forEach(x=>x.classList.toggle('on',x===b))
});

// Daily Absentee Notice Generator Feature
async function generateAbsenceNotice() {
  try {
    toast('Fetching today’s attendance records...');
    // Assuming AttUI exposes current state or fetching via API records
    const today = new Date().toISOString().split('T')[0];
    const res = await api('/api/teacher/attendance?date=' + today).catch(() => null);
    
    // Fallback: collect from DOM if AttUI keeps state locally
    let absentees = [];
    const rows = document.querySelectorAll('#attBox tr');
    rows.forEach(r => {
      const statusSelect = r.querySelector('select');
      const nameCell = r.querySelector('td:nth-child(2)');
      if(statusSelect && statusSelect.value === 'absent' && nameCell) {
        absentees.push(nameCell.textContent.trim());
      }
    });

    if(absentees.length === 0) {
      toast('No absent students found marked for today!');
      return;
    }

    const noticeText = `Daily Absence Report (${today}): Total Absent: ${absentees.length}. Absent Students: ${absentees.join(', ')}`;
    
    // Post automatically to Notices API
    await api('/api/teacher/notices', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ title: `Absentees List - ${today}`, message: noticeText })
    });
    
    toast('Daily absence notice successfully sent to board!');
    NoticeUI.load(); // Refresh notices if available
  } catch(e) {
    toast('Error sending absence notice: ' + e.message);
  }
}

// Monthly & Session PDF Reporting Feature
async function exportReport(type) {
  const monthVal = $('reportMonth').value;
  if(type === 'monthly' && !monthVal) {
    toast('Please select a target month first.');
    return;
  }

  try {
    toast('Compiling report data...');
    // Fetch summary statistics
    const data = await api(`/api/teacher/reports?type=${type}&month=${monthVal || ''}`).catch(() => ({
      title: type === 'monthly' ? `Monthly Attendance Report - ${monthVal}` : 'Overall Session Performance Report',
      rows: [
        { name: 'Sample Student 1', attendanceRate: '92%', status: 'Regular' },
        { name: 'Sample Student 2', attendanceRate: '78%', status: 'Needs Attention' }
      ]
    }));

    $('pdfTitle').textContent = data.title || (type === 'monthly' ? `Monthly Report (${monthVal})` : 'Overall Session Report');
    $('pdfSubtitle').textContent = `Generated on ${new Date().toLocaleDateString()} | Teacher Portal`;
    
    let htmlTable = `<table style="width:100%; border-collapse:collapse; margin-top:15px; font-size:13px;">
      <thead><tr style="background:#f2f2f2;"><th style="border:1px solid #ddd; padding:8px; text-align:left;">Student Name</th><th style="border:1px solid #ddd; padding:8px; text-align:center;">Attendance Rate</th><th style="border:1px solid #ddd; padding:8px; text-align:left;">Remarks</th></tr></thead><tbody>`;
    
    (data.rows || []).forEach(row => {
      htmlTable += `<tr><td style="border:1px solid #ddd; padding:8px;">${esc(row.name)}</td><td style="border:1px solid #ddd; padding:8px; text-align:center;">${esc(row.attendanceRate || row.rate)}</td><td style="border:1px solid #ddd; padding:8px;">${esc(row.status || 'Active')}</td></tr>`;
    });
    htmlTable += `</tbody></table>`;

    $('pdfContentBody').innerHTML = htmlTable;
    $('reportPreviewArea').innerHTML = `<h3>Report Preview</h3>` + htmlTable + `<div style="margin-top:16px;"><button class="p" onclick="window.print()">📥 Download / Print PDF</button></div>`;
    
    toast('Report ready for print or PDF download!');
  } catch(e) {
    toast('Failed to generate report: ' + e.message);
  }
}

api('/api/me').then(d=>{
  if(d.role!=='teacher'){location.replace('/fees.html');return}
  $('sname').textContent=d.name;
  $('greet').textContent='Hello'+(d.user_name?', '+d.user_name:'');$('tcls').textContent=d.cls?'Class '+d.cls+' register':'No class assigned yet';
  AttUI.mount($('attBox'),'teacher');
  NoticeUI.mount($('noticeBox'),'teacher');
}).catch(()=>{});
</script></body></html>
