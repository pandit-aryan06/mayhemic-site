<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 80-Day Communication Bundle</title>
<meta name="description" content="Two 80-day training manuals to help you speak clearly, think sharply and persuade under pressure. 127 pages, both for Rs. 299.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;900&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--l:rgba(255,255,255,.16);--m:rgba(255,255,255,.66);--e:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#040406;color:#fff;font-family:Manrope,"Helvetica Neue",Arial,sans-serif;line-height:1.65;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid #9fd0ff;outline-offset:3px}
.au{position:fixed;border-radius:50%;opacity:.26;z-index:0;will-change:transform;animation:dr 18s ease-in-out infinite alternate}
.a1{width:46vw;height:46vw;background:radial-gradient(circle,#2b52ff 0,transparent 68%);left:-12vw;top:10vh}
.a2{width:40vw;height:40vw;background:radial-gradient(circle,#7b3dff 0,transparent 68%);right:-10vw;top:50vh;animation-delay:-9s}
@keyframes dr{to{transform:translate(10vw,-12vh) scale(1.25)}}
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,#fff,#9fd0ff);z-index:95}
.cur{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px;border:1px solid #fffa;border-radius:50%;pointer-events:none;z-index:90;transition:width .3s,height .3s,margin .3s,background .3s}
.cur.big{width:74px;height:74px;margin:-37px;background:rgba(255,255,255,.2)}
@media(hover:none){.cur{display:none}}
#ld{position:fixed;inset:0;z-index:99;background:#040406;display:grid;place-items:center;animation:lo 1s var(--e) 1.1s forwards}
#ld i{display:block;width:0;height:1px;background:#fff;animation:ll 1s var(--e) forwards}
@keyframes ll{to{width:min(60vw,360px)}}
@keyframes lo{from{clip-path:inset(0)}to{clip-path:inset(0 0 100% 0);visibility:hidden}}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 6vw;z-index:70;background:#040406cc;backdrop-filter:blur(10px)}
header b{font-family:Unbounded,sans-serif;letter-spacing:.18em;font-size:13px;text-decoration:none}
header a{text-decoration:none;font-size:14px;color:var(--m)}
header a.go{color:#040406;background:#fff;padding:8px 18px;border-radius:30px;font-weight:700}
section{position:relative;z-index:2;padding:14vh 6vw}
